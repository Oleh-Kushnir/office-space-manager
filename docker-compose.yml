services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: office_space_manager
      POSTGRES_USER: office_admin
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U office_admin -d office_space_manager" ]
      interval: 2s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: office_space_manager
      DB_USER: office_admin
      DB_PASSWORD: devpassword
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db

volumes:
  postgres_data: